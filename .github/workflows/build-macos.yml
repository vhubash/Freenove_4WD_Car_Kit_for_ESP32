name: Build macOS Executable

on:
  push:
    branches:
      - macos-build-workflow
    paths:
      - 'TCP/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip3 install PyQt5==5.15.9
          pip3 install Pillow==10.0.0
          pip3 install opencv-python==4.8.0.74
          pip3 install numpy==1.24.3
          pip3 install pyinstaller==6.1.0
      
      - name: Build executable with PyInstaller
        run: |
          cd TCP
          pyinstaller --onefile \
            --windowed \
            --add-data "image:image" \
            --name "ESP32_TCP_Client" \
            --hidden-import=PyQt5 \
            --hidden-import=cv2 \
            --osx-bundle-identifier=com.esp32.tcpclient \
            main.py
      
      - name: Create DMG
        run: |
          cd TCP
          if [ -d "dist/ESP32_TCP_Client.app" ]; then
            hdiutil create -volname "ESP32_TCP_Client" \
              -srcfolder dist/ESP32_TCP_Client.app \
              -ov -format UDZO dist/ESP32_TCP_Client.dmg
            ls -lh dist/ESP32_TCP_Client.dmg
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-executable
          path: TCP/dist/
          retention-days: 30
      
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            TCP/dist/ESP32_TCP_Client
            TCP/dist/ESP32_TCP_Client.dmg
          tag_name: macos-build-${{ github.run_number }}
          release_name: macOS Build ${{ github.run_number }}
          body: |
            macOS executable for ESP32 TCP Client
            
            Built on: macOS Latest (ARM64)
            Python version: 3.11
            PyInstaller version: 6.1.0
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}